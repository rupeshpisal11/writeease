<script>
document.addEventListener('DOMContentLoaded', () => {
  requireAuth();

  const credits = Credits.get();
  const dot = document.getElementById('credit-dot');
  if (credits <= 2) dot.classList.add('empty');
  else if (credits <= 5) dot.classList.add('low');

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = iso => new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });

  const slug = new URLSearchParams(location.search).get('slug');
  const idx = BLOG_POSTS.findIndex(p => p.slug === slug);
  const el = document.getElementById('blog-article');

  if (idx === -1) {
    document.title = 'Article not found — WriteEase AI';
    el.innerHTML = `<div class="empty-state">
      <h3>Article not found</h3>
      <p>That article doesn't exist or may have been moved.</p>
      <a href="blog.html" class="btn btn-primary btn-sm" style="margin-top:16px">← Back to Blog</a>
    </div>`;
    return;
  }

  const p = BLOG_POSTS[idx];
  document.title = p.title + ' — WriteEase AI';

  const related = BLOG_POSTS.filter(x => x.slug !== p.slug && x.category === p.category)
    .concat(BLOG_POSTS.filter(x => x.slug !== p.slug && x.category !== p.category)).slice(0, 2);

  el.innerHTML = `
    <a href="blog.html" class="blog-back">← All articles</a>
    <header class="blog-article-header">
      <span class="badge ${p.badge}">${esc(p.category)}</span>
      <h1>${esc(p.title)}</h1>
      <div class="blog-card-meta"><span>${fmt(p.date)}</span><span>·</span><span>${p.readTime} min read</span></div>
    </header>
    <div class="blog-body">${p.content}</div>
    <div class="blog-cta">
      <div>
        <h3>Put it into practice</h3>
        <p>Try the ${esc(p.tool.name)} on your own writing.</p>
      </div>
      <a href="${p.tool.href}" class="btn btn-primary btn-sm">Open ${esc(p.tool.name)} →</a>
    </div>
    <h2 class="blog-related-title">Keep reading</h2>
    <div class="blog-grid blog-grid-2">
      ${related.map(r => `<a href="blog-post.html?slug=${encodeURIComponent(r.slug)}" class="blog-card">
        <div class="blog-card-top"><div class="tool-icon ${r.iconClass}">${r.icon}</div><span class="badge ${r.badge}">${esc(r.category)}</span></div>
        <h3>${esc(r.title)}</h3>
        <p>${esc(r.excerpt)}</p>
        <div class="blog-card-meta"><span>${r.readTime} min read</span><span class="blog-card-arrow">→</span></div>
      </a>`).join('')}
    </div>`;
});
</script>
